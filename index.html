<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover, damit env(safe-area-inset-*) auf Geräten mit Notch greift -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS nimmt für den Homescreen kein SVG und maskiert die Ecken selbst,
         deshalb ein volles Quadrat als PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- start_url und die Icon-Pfade im Manifest sind relativ, damit sie den
         GitHub-Pages-Unterpfad ohne Anpassung mitmachen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Hide &amp; Seek" />
    <!-- Vom Homescreen ohne Browserleiste starten. iOS wertet das Manifest dafür
         nur eingeschränkt aus und braucht weiterhin diese Angaben. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Der Inhalt darf unter die Statusleiste laufen; die Kopfzeile hält sich mit
         env(safe-area-inset-top) selbst frei. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Spielkarte für Hide & Seek in der Region Amsterdam" />
    <title>Hide &amp; Seek — Amsterdam</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
